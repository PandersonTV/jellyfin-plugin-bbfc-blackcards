<div id="BBFCConfigurationPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form id="BBFCConfigForm">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle">BBFC Black Card Generator</h2>
                </div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="FfmpegPath">FFmpeg Executable Path</label>
                    <input id="FfmpegPath" name="FfmpegPath" type="text" is="emby-input" class="emby-input" />
                    <div class="fieldDescription">Path to ffmpeg (e.g. <code>C:\Program Files\Jellyfin\Server\ffmpeg.exe</code>).</div>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label>
                        <input id="OverwriteExisting" name="OverwriteExisting" type="checkbox" is="emby-checkbox" />
                        <span>Overwrite existing black cards</span>
                    </label>
                    <div class="fieldDescription checkboxFieldDescription">If enabled, existing <code>blackcard.mp4</code> files in movie extras folders will be regenerated.</div>
                </div>

                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="text/javascript">
        var BBFCConfig = {
            pluginUniqueId: 'f6e8b0d2-9d32-4d64-8842-1e9a26369c5e'
        };

        $('#BBFCConfigurationPage').on('pageshow', function () {
            var page = this;
            Dashboard.showLoadingMsg();

            ApiClient.getPluginConfiguration(BBFCConfig.pluginUniqueId).then(function (config) {
                $('#FfmpegPath', page).val(config.FfmpegPath || '');
                $('#OverwriteExisting', page).prop('checked', config.OverwriteExisting || false);
                Dashboard.hideLoadingMsg();
            });
        });

        $('#BBFCConfigForm').on('submit', function () {
            Dashboard.showLoadingMsg();
            var page = $(this).parents('#BBFCConfigurationPage')[0];

            ApiClient.getPluginConfiguration(BBFCConfig.pluginUniqueId).then(function (config) {
                config.FfmpegPath = $('#FfmpegPath', page).val();
                config.OverwriteExisting = $('#OverwriteExisting', page).prop('checked');

                ApiClient.updatePluginConfiguration(BBFCConfig.pluginUniqueId, config).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                });
            });

            return false;
        });
    </script>
</div>
